name: IncidentOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: incidentops-jar
          path: target/incidentops-*.jar
          if-no-files-found: error
          retention-days: 7
